# 잇다 합성 데이터 문체(페르소나) 목록. 이 파일은 고치지 않음 (고치면 김우진에게 먼저 알림)
# T01~T10: 학습용. 팀원 4명이 2개씩 고름 (T01은 반드시 누군가 고름)
# V01: 검증 전용, E01~E02: 평가 전용. 김우진만 씀. 학습용으로 절대 쓰지 않음

T01:
  이름: '50대 딸 (기획안 1차 페르소나)'
  관계: '딸. 어머니를 "엄마"라고 부름'
  말투: '존댓말 섞인 메모체. 문장 끝을 "~하심", "~드심", "~주무심"으로 끝냄'
  길이: '2~3문장'
  습관: '저녁이나 다음 날 아침에 몰아 씀. "어젯밤", "아까", "저녁에" 같은 상대 시간 표현을 자주 씀'
  오타: '거의 없음'
  예시: '"어젯밤 두 시쯤 깨셔서 한참 거실 왔다갔다 하심. 아침은 그래도 잘 드심."'
T02:
  이름: '40대 아들 직장인'
  관계: '아들. 어머니를 "어머니"라고 부름'
  말투: '짧은 반말 메모. 명사로 끝나는 문장이 많음 ("~함", "~음")'
  길이: '1~2문장, 한 줄'
  습관: '퇴근 후 밤늦게 씀. 시간 표현을 거의 안 씀'
  오타: '보통 (띄어쓰기 틀림)'
  예시: '"저녁에 약 안먹는다고 버팀. 결국 먹음."'
T03:
  이름: '70대 아내'
  관계: '배우자. 남편을 "영감", "이 양반"이라고 부름'
  말투: '말하듯 쓴 구어체. 맞춤법과 띄어쓰기가 자주 틀림'
  길이: '2~4문장, 한 문장이 길게 이어짐'
  습관: '며칠 치를 몰아 씀. "그저께", "어제"를 섞어 씀'
  오타: '많음 (예: "안드셔서", "그랫다")'
  예시: '"영감이 그저께 밤에 화장실 가다 넘어질뻔 햇는데 오늘은 밥을 반도 안먹고 그냥 누웟음"'
T04:
  이름: '40대 며느리'
  관계: '며느리. 시어머니를 "어머님"이라고 부름'
  말투: '정돈된 존댓말. 완결된 문장'
  길이: '2~3문장'
  습관: '거의 매일 저녁에 그날 일을 씀. "오늘", "오후에"를 자주 씀'
  오타: '거의 없음'
  예시: '"오늘 오후에 어머님께서 지갑을 누가 가져갔다고 하셨습니다. 저녁 식사는 평소대로 하셨습니다."'
T05:
  이름: '30대 딸'
  관계: '딸. 아버지를 "아빠"라고 부름'
  말투: '줄임말과 "ㅠㅠ", "ㅋㅋ" 같은 표현을 섞음. 휴대폰으로 빠르게 씀'
  길이: '1~3문장, 짧게 끊음'
  습관: '생각날 때 바로 씀. "아까"를 자주 씀'
  오타: '보통'
  예시: '"아까 아빠가 나보고 누구냐고 함ㅠㅠ 저녁은 몇 숟갈만 드심"'
T06:
  이름: '60대 아들 은퇴자'
  관계: '아들. 아버지를 "아버지"라고 부름'
  말투: '보고서처럼 딱딱함. "~함.", "~임."으로 끝냄. 항목을 나열하듯 씀'
  길이: '2~4문장'
  습관: '시각을 숫자로 정확히 적음 ("새벽 3시 10분"). 다음 날 아침에 씀'
  오타: '거의 없음'
  예시: '"새벽 3시 10분 기상, 현관문 개방 시도함. 30분 후 취침함."'
T07:
  이름: '70대 남편'
  관계: '배우자. 아내를 "집사람"이라고 부름'
  말투: '무뚝뚝한 단답. 존칭 없음'
  길이: '1~2문장, 아주 짧음'
  습관: '큰일이 있을 때만 씀. 시간 표현은 "어제", "오늘" 정도'
  오타: '보통'
  예시: '"집사람 오늘 또 짜증냄. 밥 안먹음."'
T08:
  이름: '70대 여동생'
  관계: '환자의 여동생. 환자를 "언니"라고 부름'
  말투: '옛날식 존댓말. "취침", "기상", "식사" 같은 한자어를 섞음'
  길이: '2~3문장'
  습관: '낮에 들러서 본 것을 저녁에 씀. "낮에", "오후에"를 씀'
  오타: '거의 없음'
  예시: '"언니가 낮에 불안해하며 자꾸 집에 가야 한다고 함. 식사는 반 그릇만 하심."'
T09:
  이름: '50대 딸 맞벌이'
  관계: '딸. 어머니를 "엄마"라고 부름'
  말투: '긴 서술형. 자기 감정("너무 힘들다", "속상하다")을 자주 섞음'
  길이: '3~5문장'
  습관: '주말에 몰아 씀. "며칠 전", "요즘" 같은 흐린 표현도 가끔 씀'
  오타: '적음'
  예시: '"요즘 엄마가 밤마다 깨셔서 나도 잠을 못 잔다. 어제는 저녁 약을 안 드시겠다고 해서 한참 달랬다. 너무 지친다."'
T10:
  이름: '50대 사위'
  관계: '사위. 장모를 "장모님"이라고 부름'
  말투: '간결한 존댓말. 사실만 적음'
  길이: '1~2문장'
  습관: '시간 표현을 거의 쓰지 않음'
  오타: '거의 없음'
  예시: '"장모님께서 방에 모르는 사람이 있다고 하셨습니다."'
V01:
  이름: '40대 조카 (검증 전용)'
  관계: '조카. 환자를 "이모님"이라고 부름'
  말투: '존댓말과 반말이 섞인 평서문'
  길이: '2~3문장'
  습관: '주 2~3회 들러서 씀. "오늘", "지난번"을 씀'
  오타: '보통'
  예시: '"오늘 이모님이 저를 삼촌으로 착각하셨어요. 점심은 평소보다 적게 드심."'
E01:
  이름: '60대 아내, 경상도 사투리 (평가 전용)'
  관계: '배우자. 남편을 "우리 양반"이라고 부름'
  말투: '경상도 사투리 구어체 ("~했다 아이가", "~하데")'
  길이: '2~3문장'
  습관: '저녁에 씀. "어제", "아까"를 씀'
  오타: '보통'
  예시: '"우리 양반이 어제 밤에 문 열고 나갈라 카데. 아까 밥은 쪼매만 묵었다."'
E02:
  이름: '20대 손녀, 메신저 말투 (평가 전용)'
  관계: '손녀. 할머니를 "할머니"라고 부름'
  말투: '메신저 말투. 문장을 짧게 여러 번 끊음'
  길이: '2~4개의 짧은 문장'
  습관: '주말에 돌보고 그날 씀'
  오타: '적음'
  예시: '"할머니 오늘 좀 예민하심. 별거 아닌데 화내심. 저녁은 거의 안 드심"'
